[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-python-learning"
version = "0.1.0"
description = "A small Python learning project with standard-library tests"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hello-python = "hello_python.__main__:main"

[tool.setuptools]
packages = ["hello_python"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
