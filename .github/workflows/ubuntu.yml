name: Ubuntu learning environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            examples
            scripts
            tests
            .github
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check maintained Bash scripts
        run: bash tests/lint.sh

  install:
    name: Install on Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Official tags: docker-library/official-images, library/ubuntu.
        ubuntu: ['22.04', '24.04', '26.04']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            examples
            scripts
            tests
            .github
      - name: Full install, reinstall, user settings, and language projects
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --workdir /repo \
            "ubuntu:$UBUNTU_VERSION" bash tests/integration.sh
