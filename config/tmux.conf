# Keep the familiar Ctrl-b prefix. Ctrl-b ? shows all bindings.
set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -s escape-time 10
setw -g mode-keys vi

# Splits and new windows start in the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour114] #S #[default]"
set -g status-right "#[fg=colour109]%Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=colour235,bg=colour114,bold"
set -g status-interval 30

source-file -q ~/.tmux.conf.local
